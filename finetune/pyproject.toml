# The environment fine-tuning runs in on the DGX Spark: Linux on ARM64 (Grace), a Blackwell GPU, CUDA 13
[project]
name = "laya-finetune"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "laya==0.4.18",
    # Built for CUDA 13.0, the oldest CUDA 13 runtime, so it runs on any driver the Spark has had
    "torch==2.14.1",
]

[tool.uv]
package = false
# Resolved for the Spark only; on another machine `uv sync` refuses instead of installing another torch
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
